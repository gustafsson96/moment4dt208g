<h1>Courses</h1>
<!-- Course Table -->
<table id="course-table">
    <thead>
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Progression</th>
      </tr>
    </thead>
    <tbody *ngFor="let course of courses">
        <td>{{ course.code }}</td>
        <td>{{ course.coursename }}</td>
        <td>{{ course.progression }}</td>
    </tbody>
  </table>
